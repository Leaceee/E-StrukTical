{% extends "base.html" %}
{% block title %}Login - E-Struktical{% endblock %}

{% block content %}
<div class="page-bg">
  <div class="card-wrap">
    <section class="card glass auth-card">

      <div class="auth-header auth-header-login">
        <img src="{{ url_for('static', filename='img/logo-daun.png') }}" alt="logo" class="auth-logo">
        <h1 class="auth-title">E-Struktical</h1>
        <p class="auth-subtitle-login">Struk Digital, Poin Ramah Lingkungan</p>
        <div class="auth-line-login"></div>
      </div>

      <form method="post" action="{{ url_for('login') }}" class="auth-form-login">

        <!-- EMAIL -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="14" rx="3"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
                <path d="M5 7l7 5 7-5"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
              </svg>
            </span>
            <input type="email" name="email"
                  placeholder="contoh@mail.com"
                  required autocomplete="email">
          </div>
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">

            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <rect x="6" y="10" width="12" height="10" rx="2"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
                <path d="M9 10V8a3 3 0 0 1 6 0v2"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
              </svg>
            </span>

            <input id="login_password"
                  type="password"
                  name="password"
                  placeholder="Masukkan password"
                  required>

            <!-- EYE TOGGLE -->
            <button type="button"
                    class="eye-btn"
                    onclick="togglePassword('login_password', this)"
                    aria-label="Tampilkan / sembunyikan password">

              <svg class="eye-icon" width="22" height="22" viewBox="0 0 24 24">

                <!-- MATA -->
                <path class="eye-open"
                      d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"
                      fill="none" stroke="#2bb673" stroke-width="2"/>
                <circle class="eye-open"
                        cx="12" cy="12" r="3"
                        fill="none" stroke="#2bb673" stroke-width="2"/>

                <!-- GARIS SILANG -->
                <line class="eye-slash"
                      x1="3" y1="3" x2="21" y2="21"
                      stroke="#2bb673" stroke-width="2"/>
              </svg>

            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          Login <span class="btn-arrow">➜</span>
        </button>

        <p class="auth-footer-text">
          Belum punya akun?
          <a href="{{ url_for('register') }}">Daftar disini</a>
        </p>

      </form>
    </section>
  </div>
</div>
{% endblock %}
