{% extends "base.html" %}
{% block title %}Daftar - E-Struktical{% endblock %}

{% block content %}
<div class="page-bg">
  <div class="card-wrap">
    <section class="card glass auth-card auth-card--tall">

      <div class="auth-header auth-header-register">
        <img src="{{ url_for('static', filename='img/logo-daun.png') }}" class="auth-logo">
        <h1 class="auth-title">E-Struktical</h1>
        <p class="auth-subtitle-register">
          Buat akun, kumpulkan poin, selamatkan lingkungan
        </p>
        <div class="auth-line-register"></div>
      </div>

      <form method="post" action="{{ url_for('register') }}" class="auth-form-register">

        <!-- NAMA -->
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <img src="{{ url_for('static', filename='img/Icon-orang.png') }}">
            </span>
            <input type="text" name="nama" placeholder="Nama lengkap" required>
          </div>
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <img src="{{ url_for('static', filename='img/icon-email.png') }}">
            </span>
            <input type="email" name="email" placeholder="contoh@mail.com" required>
          </div>
        </div>

        <!-- PASSWORD (INI FIX UTAMA) -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">

            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <rect x="6" y="10" width="12" height="10" rx="2"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
                <path d="M9 10V8a3 3 0 0 1 6 0v2"
                      fill="none" stroke="#fff" stroke-width="1.4"/>
              </svg>
            </span>

            <input
              id="register_password"
              type="password"
              name="password"
              placeholder="Buat password"
              required
            >

            <button
  type="button"
  class="eye-btn"
  onclick="togglePassword('register_password', this)"
  aria-label="Tampilkan password"
>
  <svg class="eye-icon" width="22" height="22" viewBox="0 0 24 24">
    <!-- mata -->
    <path class="eye-open"
      d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"
      fill="none" stroke="#2bb673" stroke-width="2"/>
    <circle class="eye-open"
      cx="12" cy="12" r="3"
      fill="none" stroke="#2bb673" stroke-width="2"/>

    <!-- garis silang -->
    <line class="eye-slash"
      x1="3" y1="3" x2="21" y2="21"
      stroke="#2bb673" stroke-width="2"/>
  </svg>
</button>


          </div>
        </div>

        <!-- ALAMAT -->
      <div class="form-group">
  <label class="form-label">
    Alamat <span class="label-optional">(opsional)</span>
  </label>

  <div class="textarea-wrapper">
    <textarea
      name="alamat"
      placeholder="Alamat tempat tinggal"
      rows="4"
    ></textarea>
  </div>
</div>


        <!-- NO HP -->
        <div class="form-group">
          <label class="form-label">No Handphone</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <img src="{{ url_for('static', filename='img/icon-handphone.png') }}">
            </span>
            <input type="text" name="no_hp" placeholder="0812xxxx">
          </div>
        </div>

        <button type="submit" class="btn-primary">
          Daftar Akun <span class="btn-arrow">➜</span>
        </button>

        <p class="auth-footer-text">
          Sudah punya akun?
          <a href="{{ url_for('login') }}">Login Disini</a>
        </p>

      </form>
    </section>
  </div>
</div>
{% endblock %}
